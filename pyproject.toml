[project]
name = "xai-transfer"
version = "0.1.0"
description = "Comparing glassbox and ICL models via explanation-guided input perturbations"
readme = "README.md"
authors = [
    { name = "PetrashU", email = "petrashevichulyana@gmail.com" },
    { name = "Karol Łukasik", email = "karollukasik423@gmail.com" },
    { name = "Kacper Chabowski", email = "kacper.chabowski.szkola@gmail.com"},
]
requires-python = ">=3.11"
dependencies = [
    "interpret>=0.7.8",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openml>=0.15.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tabpfn>=9.2.0",
    "wandb>=0.31.0",
    "xgboost>=3.2.0",
]

[project.scripts]
xai-transfer = "xai_transfer:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.optional-dependencies]
cpu = ["torch>=2.7"]
cu128 = ["torch>=2.7"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true